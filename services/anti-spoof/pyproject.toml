[project]
name = "anti-spoof"
version = "0.0.0"
description = "Recogniz-Me document anti-spoofing service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11",
    "python-multipart>=0.0.9",
    "scipy>=1.14",
    "uvicorn>=0.32",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
anti-spoof = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["models/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
