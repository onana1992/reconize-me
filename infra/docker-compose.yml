services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: reconizme
      MYSQL_USER: reconizme
      MYSQL_PASSWORD: reconizme2026@
      MYSQL_ROOT_PASSWORD: reconizme2026@
    ports:
      - "3306:3306"
    volumes:
      - reconizme_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ureconizme", "-preconizme2026@"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reconizme_mysql:
